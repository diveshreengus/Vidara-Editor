name: Build VIDARA Editor
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q VidaraEditor.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Test and build
        working-directory: VidaraEditor
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace > build.log 2>&1
          code=$?
          echo '## Build errors' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |What went wrong|Execution failed|Unresolved|Could not|error:" -A3 build.log | head -80 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: VidaraEditor-debug-apk
          path: VidaraEditor/app/build/outputs/apk/debug/*.apk
